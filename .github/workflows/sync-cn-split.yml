name: 每日同步 CN Split Tunnels 到 Cloudflare Zero Trust
permissions:
  contents: write           # 只需要此權限，允許 Action 自動提交 Commit 來重新計算 60 天

on:
  schedule:
    - cron: '0 2 * * *'  # 每日 UTC 02:00（北京时间 10:00）自動執行
  workflow_dispatch:         # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行同步脚本
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          MODE: exclude
        run: python cf-zt-cn-split.py

      - name: 防止 GitHub 60 天自動停用工作流 (Commit 模式)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: false            # 關閉 API 模式，改用純 Commit 模式繞過阻擋
